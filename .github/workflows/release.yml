name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          BODY=$(awk -v ver="$VERSION" '
            index($0, "## " ver) == 1 { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md)
          [ -z "$BODY" ] && BODY="详见 CHANGELOG.md"
          {
            echo "BODY<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build module zip
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          ZIP_NAME="HyperOS-Debloat-${VERSION}.zip"
          mkdir -p /tmp/module/META-INF/com/google/android
          cp install.sh uninstall.sh post-fs-data.sh service.sh module.prop pkg_map.sh apps.db /tmp/module/
          mkdir -p /tmp/module/webroot
          cp webroot/* /tmp/module/webroot/
          echo '#MAGISK' > /tmp/module/META-INF/com/google/android/updater-script
          printf '#!/sbin/sh\numask 022\nui_print() { echo "$1"; }\nrequire_new_magisk() {\n  ui_print "*******************************"\n  ui_print " Please install Magisk v20.4+! "\n  ui_print "*******************************"\n  exit 1\n}\nOUTFD=$2\nZIPFILE=$3\nmount /data 2>/dev/null\n[ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk\n. /data/adb/magisk/util_functions.sh\n[ $MAGISK_VER_CODE -lt 20400 ] && require_new_magisk\ninstall_module\nexit 0\n' > /tmp/module/META-INF/com/google/android/update-binary
          cd /tmp/module && zip -r "/tmp/${ZIP_NAME}" .
          cp "/tmp/${ZIP_NAME}" ${GITHUB_WORKSPACE}/

      - name: Build cleanup zip
        run: |
          CLEANUP_ZIP="HyperOS-Debloat-cleanup.zip"
          mkdir -p /tmp/cleanup/META-INF/com/google/android
          cp cleanup/update-binary /tmp/cleanup/META-INF/com/google/android/update-binary
          cp cleanup/updater-script /tmp/cleanup/META-INF/com/google/android/updater-script
          chmod +x /tmp/cleanup/META-INF/com/google/android/update-binary
          cd /tmp/cleanup && zip -r "/tmp/${CLEANUP_ZIP}" .
          cp "/tmp/${CLEANUP_ZIP}" ${GITHUB_WORKSPACE}/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: HyperOS-Debloat ${{ steps.version.outputs.VERSION }}
          draft: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'rc') }}
          prerelease: false
          make_latest: ${{ !contains(steps.version.outputs.VERSION, 'beta') && !contains(steps.version.outputs.VERSION, 'alpha') && !contains(steps.version.outputs.VERSION, 'rc') }}
          body: |
            ## ${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.BODY }}

            ---

            ### 安装方法
            1. 下载 `HyperOS-Debloat-${{ steps.version.outputs.VERSION }}.zip`
            2. 在 KernelSU 管理器中从本地安装
            3. 重启生效

            ### 精简模式
            | 模式 | 说明 |
            |------|------|
            | ✅ 快速精简（推荐） | 广告/追踪 + 游戏中心 |
            | ⚡ 标准精简 | + 设备互联/生态 |
            | 🔥 深度精简 | + AI/小爱 + 内容/工具/安全 + 系统服务 + 无障碍/宏 |
            | 🎛️ 自定义模式 | 每组可选：全部精简 / 全部保留 / 逐个选择 |
          files: |
            HyperOS-Debloat-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
